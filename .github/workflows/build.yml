name: Build APK

# Every push to main builds a signed APK with a new versionCode and publishes it with an
# update manifest (update.json) that installed kiosks poll. See README › Updates.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # versionCode = run number + offset, so it always increases (the first hand-built APK was 1).
  VERSION_CODE_OFFSET: 100

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          code=$((GITHUB_RUN_NUMBER + VERSION_CODE_OFFSET))
          echo "KIOSK_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "KIOSK_VERSION_NAME=0.1.$code" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KIOSK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "KIOSK_KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"
            echo "KIOSK_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::KIOSK_KEYSTORE_BASE64 is not set, so this APK is debug-signed and will not be published."
          fi

      - name: Build
        env:
          KIOSK_KEYSTORE_PASSWORD: ${{ secrets.KIOSK_KEYSTORE_PASSWORD }}
          KIOSK_KEY_ALIAS: ${{ secrets.KIOSK_KEY_ALIAS }}
          KIOSK_KEY_PASSWORD: ${{ secrets.KIOSK_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          rm -f release.jks
          mkdir -p public
          apk="ed22-kiosk-$KIOSK_VERSION_CODE.apk"
          cp app/build/outputs/apk/release/app-release.apk "public/$apk"
          cp "public/$apk" ed22-kiosk.apk
          jq -n --argjson code "$KIOSK_VERSION_CODE" --arg name "$KIOSK_VERSION_NAME" --arg url "$apk" \
            --arg sha "$(sha256sum "public/$apk" | cut -d' ' -f1)" \
            '{versionCode: $code, versionName: $name, url: $url, sha256: $sha}' > public/update.json
          cat public/update.json

      - uses: actions/upload-artifact@v4
        with:
          name: ed22-kiosk-apk
          path: |
            ed22-kiosk.apk
            public/update.json

      # One GitHub Release per build (private, like the repo): a record of every shipped APK.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.KIOSK_SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.KIOSK_VERSION_CODE }}
          name: ED22 Kiosk ${{ env.KIOSK_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: |
            public/ed22-kiosk-${{ env.KIOSK_VERSION_CODE }}.apk
            public/update.json

      # Public hosting that kiosks can reach without a token. Turned on by setting the repository
      # variable KIOSK_PUBLISH_PAGES=true and Settings › Pages › Source = GitHub Actions.
      - name: Package for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.KIOSK_SIGNED == 'true' && vars.KIOSK_PUBLISH_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  pages:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.KIOSK_PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
